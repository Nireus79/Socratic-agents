[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-agents"
version = "0.4.0"
description = "Constitutional AI Agents - Multi-agent platform with governance and ethical decision-making"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anthropic", email = "support@anthropic.com"}
]
keywords = [
    "constitutional-ai",
    "agents",
    "governance",
    "multi-agent",
    "llm",
    "socratic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
client = ["httpx>=0.24.0"]
governance = ["socratic-morality>=0.0.3"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Nireus79/Socratic-agents"
Documentation = "https://github.com/Nireus79/Socratic-agents#readme"
Repository = "https://github.com/Nireus79/Socratic-agents.git"
Issues = "https://github.com/Nireus79/Socratic-agents/issues"

[tool.setuptools]
packages = ["socratic_agents"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=socratic_agents --cov-report=html"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.config"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.github_sync_handler"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.governance"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.knowledge_analysis"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.document_processor"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.conflict_detector"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.code_validation_agent"
ignore_errors = true

[[tool.mypy.overrides]]
module = "socratic_agents.code_generator"
ignore_errors = true
